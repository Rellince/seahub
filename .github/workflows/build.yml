name: Build and Deploy

on:
  push:
    branches: [rellince]
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Upstream seafileltd/seafile-mc base tag"
        required: false
        type: string
        default: "13.0.21"

env:
  REGISTRY_OWNER: ${{ secrets.DOCKERHUB_NAMESPACE }}
  IMAGE_NAME: rellince

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::12}
          TAG="seahub-${{ github.run_number }}-${SHA_SHORT}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          BASE_TAG="${{ inputs.base_tag }}"
          [ -z "$BASE_TAG" ] && BASE_TAG="13.0.21"
          echo "base_tag=${BASE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/seahub/Dockerfile.prod
          push: true
          build-args: |
            BASE_TAG=${{ steps.meta.outputs.base_tag }}
          tags: |
            ${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:seahub-latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/rellince'
    steps:
      - name: Trigger seafile-deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy.yml \
            -R rellince/seafile-deploy \
            -f image_tag=${{ needs.build-and-push.outputs.image_tag }}
